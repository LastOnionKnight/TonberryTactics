name: One-shot web 1.6.1 health patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/maintenance-161.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Refresh live version and export copy
        shell: python
        run: |
          from pathlib import Path

          path = Path('Pages/Index.razor')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'paired with plugin v1.5.x': 'paired with plugin v1.6.1',
              'Paste the <span class="tok">GG-EXPORT:v1:</span> string from <span class="cmd">/ttexport</span> to begin the audit.': 'Paste the <span class="tok">GG-EXPORT:v2:</span> string from <span class="cmd">/ttexport</span> to begin the audit. v1 exports remain accepted for compatibility.',
              'placeholder="GG-EXPORT:v1:eyJwbHVnaW4iOiJUb25iZXJyeVRhY3RpY3MiLi4u"': 'placeholder="GG-EXPORT:v2:eyJwbHVnaW4iOiJHZWFyR29ibGluIi4uLg=="',
              'Real caps require a v2 export from GearGoblin 0.6.0+.': 'Real stat-cap data requires a GG-EXPORT:v2 payload from /ttexport.',
              'Materia totals from <strong>/ttexport</strong>. Derivation rows + breakpoint markers ship in v0.6.1 (Akhmorning formulas).': 'Materia totals come from <strong>/ttexport</strong>. Optimization and audit logic use the shared GearGoblin.Core formulas and job profiles.',
              'MeldAudit · v0.6.6.0': 'MeldAudit · Core 1.6.1',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected stale string not found; refusing partial patch: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8', newline='')

      - name: Build
        run: dotnet build -c Release

      - name: Commit successful patch and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-161.yml
          git add Pages/Index.razor
          git commit -m "fix: refresh live web copy for 1.6.1 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
